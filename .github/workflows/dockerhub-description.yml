name: Sync Docker Hub description

# Keeps the Docker Hub repository overview in sync with
# docs/dockerhub-overview.md. Docker Hub renders GitHub-flavored markdown but
# cannot resolve relative links, so that file uses absolute URLs throughout.
#
# Requires a Docker Hub personal access token with **Read, Write, Delete**
# scope, stored as the DOCKERHUB_DESCRIPTION_TOKEN secret. The registry
# push token used by release.yml (DOCKER_PASSWORD) is read/write only and
# returns 403 on the description API. When the secret is absent the job skips
# instead of failing.

on:
  push:
    branches:
      - master
    paths:
      - 'docs/dockerhub-overview.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    # secrets are not available in `if:` conditions, so surface it as env.
    env:
      DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip notice
        if: env.DESCRIPTION_TOKEN == ''
        run: |
          echo "::warning::DOCKERHUB_DESCRIPTION_TOKEN is not set — skipping." \
               "Create a Docker Hub PAT with Read/Write/Delete scope and add it" \
               "as a repository secret, or paste docs/dockerhub-overview.md into" \
               "the Docker Hub web UI by hand."

      - name: Update Docker Hub description
        if: env.DESCRIPTION_TOKEN != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ secrets.DOCKER_USERNAME }}/rmq-vertical-scaler
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: 'Auto-scales RabbitMQ CPU/memory in Kubernetes from queue metrics. Zero pod restarts on K8s 1.33+'
          enable-url-completion: true
