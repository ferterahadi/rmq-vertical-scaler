name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAJOR=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Cross-compile release binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            out="dist/rmq-vertical-scaler_${VERSION}_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/rmq-vertical-scaler
            tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
            rm "$out"
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt )
          ls -la dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rmq-vertical-scaler:latest
            ${{ secrets.DOCKER_USERNAME }}/rmq-vertical-scaler:${{ steps.version.outputs.MAJOR }}
            ${{ secrets.DOCKER_USERNAME }}/rmq-vertical-scaler:${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## What's Changed

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

            ## Docker Image

            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/rmq-vertical-scaler:${{ steps.version.outputs.VERSION }}
            ```

            ## Binaries

            Prebuilt `linux` and `darwin` (amd64/arm64) binaries are attached below, with `checksums.txt`.
          draft: false
          prerelease: false
