name: Acceptance evidence bundle

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'schema/**'
      - 'charts/**'
      - 'examples/v3/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/acceptance-evidence.yml'
      - '.github/workflows/release.yml'
      - 'scripts/package-v3-evidence.py'
      - 'scripts/check-v3-release-evidence.py'
      - 'tests/e2e-v3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Current tests and historical evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: azure/setup-helm@v4
      - name: Test current source
        run: |
          go test -race ./...
          go vet ./...
      - name: Test evidence validation
        run: |
          python3 -m pip install -r tests/e2e-v3/requirements.txt
          python3 -m unittest discover -s tests/e2e-v3 -p 'test_*.py'
      - name: Reproduce development evidence
        run: python3 scripts/package-v3-evidence.py --historical
      - name: Verify development acceptance against its recorded source
        run: python3 scripts/package-v3-evidence.py --verify-historical
      - name: Check current release readiness
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          summary = json.loads(pathlib.Path('tests/e2e-v3/acceptance-summary.json').read_text())
          if summary.get('currentSourceAccepted', True):
              subprocess.run(['python3', 'scripts/package-v3-evidence.py'], check=True)
              subprocess.run(['python3', 'scripts/check-v3-release-evidence.py', 'v3.0.0'], check=True)
          else:
              result = subprocess.run(['python3', 'scripts/check-v3-release-evidence.py', 'v3.0.0'])
              if not summary.get('releaseBlockers') or result.returncode == 0:
                  raise SystemExit('current source must remain release-blocked until new runtime evidence exists')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('Current-source tests passed; historical evidence verified. **Release blocked:** ' + '; '.join(summary['releaseBlockers']) + '\n')
          PY
      - name: Store historical evidence bundle
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: rmq-development-evidence
          path: dist/evidence/development.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record immutable artifact location
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo "Verified development evidence bundle (90-day retention): ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
