apiVersion: v1
kind: Namespace
metadata:
  name: rmq-v23-feasibility
  labels:
    rmq-vertical-scaler-test: v23-feasibility
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rmq-probe
  namespace: rmq-v23-feasibility
spec:
  replicas: 3
  image: rabbitmq:4.4.0-management
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  rabbitmq:
    additionalConfig: |
      disk_free_limit.absolute = 128MiB
      default_queue_type = quorum
      vm_memory_high_watermark.relative = 0.6
  persistence:
    storageClassName: standard
    storage: 1Gi
  service:
    type: ClusterIP
