---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "rmq-vertical-scaler-binding",
    "namespace": "rmq-v23-e2e-native"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "rmq-vertical-scaler-role"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "rmq-vertical-scaler-sa",
      "namespace": "rmq-v23-e2e-native"
    }
  ]
}
---
{
  "apiVersion": "v1",
  "data": {
    "policy.json": "{\"configVersion\":2,\"profileOrder\":[\"LOW\",\"HIGH\"],\"profiles\":{\"HIGH\":{\"requests\":{\"cpu\":\"800m\",\"memory\":\"256Mi\"},\"limits\":{\"cpu\":\"1\",\"memory\":\"1Gi\"}},\"LOW\":{\"requests\":{\"cpu\":\"100m\",\"memory\":\"256Mi\"},\"limits\":{\"cpu\":\"1\",\"memory\":\"1Gi\"}}},\"triggers\":[{\"type\":\"rabbitmq\",\"metadata\":{\"mode\":\"QueueLength\",\"aggregation\":\"sum\",\"thresholds\":{\"HIGH\":10},\"selector\":{\"queueNameRegex\":\"^closure-page-\"}}},{\"type\":\"rabbitmq\",\"metadata\":{\"mode\":\"QueueLength\",\"aggregation\":\"max\",\"thresholds\":{\"HIGH\":10},\"selector\":{\"queueNameRegex\":\"^closure-page-\"}}}],\"pollingInterval\":15,\"updatePolicy\":{\"mode\":\"Off\",\"allowRollingFallback\":false},\"behavior\":{\"scaleUp\":{\"stabilizationSeconds\":30},\"scaleDown\":{\"stepIntervalSeconds\":60,\"memoryHeadroomPercent\":20},\"metrics\":{\"maxAgeSeconds\":60}},\"kubernetes\":{\"namespace\":\"rmq-v23-e2e-native\",\"rmqServiceName\":\"rmq-probe\"},\"rmq\":{\"host\":\"rmq-probe.rmq-v23-e2e-native.svc.cluster.local\",\"port\":\"15672\"}}"
  },
  "kind": "ConfigMap",
  "metadata": {
    "name": "rmq-vertical-scaler-policy",
    "namespace": "rmq-v23-e2e-native"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "rmq-vertical-scaler",
    "namespace": "rmq-v23-e2e-native"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "rmq-vertical-scaler"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "checksum/policy": "02cc79a8aa260e875614b7a2ebffa75c4a8bb1743a31fc8b36059512228a34da"
        },
        "labels": {
          "app": "rmq-vertical-scaler"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "run",
              "--config",
              "/etc/rmq-scaler/policy.json"
            ],
            "env": [
              {
                "name": "STATUS_CONFIG_MAP",
                "value": "rmq-vertical-scaler-status"
              },
              {
                "name": "RMQ_USER",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "username",
                    "name": "rmq-probe-default-user"
                  }
                }
              },
              {
                "name": "RMQ_PASS",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "password",
                    "name": "rmq-probe-default-user"
                  }
                }
              }
            ],
            "image": "docker.io/library/rmq-vertical-scaler@sha256:04c17e5cd431ddbd5d03c7431985a28164f0f4b9e1483dc72e12943cb4df2e21",
            "name": "scaler",
            "resources": {
              "limits": {
                "cpu": "200m",
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "75m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/etc/rmq-scaler",
                "name": "policy",
                "readOnly": true
              }
            ]
          }
        ],
        "serviceAccountName": "rmq-vertical-scaler-sa",
        "volumes": [
          {
            "configMap": {
              "name": "rmq-vertical-scaler-policy"
            },
            "name": "policy"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "rmq-probe-pdb",
    "namespace": "rmq-v23-e2e-native"
  },
  "spec": {
    "minAvailable": 2,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "rmq-probe"
      }
    }
  }
}