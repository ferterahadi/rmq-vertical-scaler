      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list"
      ]
    },
    {
      "apiGroups": [
        "metrics.k8s.io"
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
