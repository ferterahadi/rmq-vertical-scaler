---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "rmq-vertical-scaler-binding",
    "namespace": "rmq-v23-e2e-native"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "rmq-vertical-scaler-role"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "rmq-vertical-scaler-sa",
      "namespace": "rmq-v23-e2e-native"
    }
  ]
}
---
{
  "apiVersion": "v1",
  "data": {
    "policy.json": "{\"configVersion\":2,\"profileOrder\":[\"LOW\",\"HIGH\"],\"profiles\":{\"HIGH\":{\"requests\":{\"cpu\":\"800m\",\"memory\":\"512Mi\"},\"limits\":{\"cpu\":\"1\",\"memory\":\"1Gi\"}},\"LOW\":{\"requests\":{\"cpu\":\"100m\",\"memory\":\"256Mi\"},\"limits\":{\"cpu\":\"1\",\"memory\":\"1Gi\"}}},\"triggers\":[{\"type\":\"memory\",\"metricType\":\"Utilization\",\"aggregation\":\"max\",\"metadata\":{\"containerName\":\"rabbitmq\",\"value\":\"1\"}}],\"pollingInterval\":15,\"updatePolicy\":{\"mode\":\"Off\",\"allowRollingFallback\":false},\"behavior\":{\"scaleUp\":{\"stabilizationSeconds\":30},\"scaleDown\":{\"stepIntervalSeconds\":60,\"memoryHeadroomPercent\":20},\"metrics\":{\"maxAgeSeconds\":60}},\"kubernetes\":{\"namespace\":\"rmq-v23-e2e-native\",\"rmqServiceName\":\"rmq-probe\"}}"
  },
  "kind": "ConfigMap",
  "metadata": {
    "name": "rmq-vertical-scaler-policy",
    "namespace": "rmq-v23-e2e-native"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "rmq-vertical-scaler",
    "namespace": "rmq-v23-e2e-native"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "rmq-vertical-scaler"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "checksum/policy": "bee4218d0ac6a737c396b8838009d011b5cf0c54fbd8742480a49a39ad780b88"
        },
        "labels": {
          "app": "rmq-vertical-scaler"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "run",
              "--config",
              "/etc/rmq-scaler/policy.json"
            ],
            "env": [
              {
                "name": "STATUS_CONFIG_MAP",
                "value": "rmq-vertical-scaler-status"
              }
            ],
            "image": "docker.io/library/rmq-vertical-scaler@sha256:5bec6039f6cd43dc829f2141007a113af5487fa61b6782fb824a905bca41a2b9",
            "name": "scaler",
            "resources": {
              "limits": {
                "cpu": "200m",
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "75m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/etc/rmq-scaler",
                "name": "policy",
                "readOnly": true
              }
            ]
          }
        ],
        "serviceAccountName": "rmq-vertical-scaler-sa",
        "volumes": [
          {
            "configMap": {
              "name": "rmq-vertical-scaler-policy"
            },
            "name": "policy"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "rmq-probe-pdb",
    "namespace": "rmq-v23-e2e-native"
  },
  "spec": {
    "minAvailable": 2,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "rmq-probe"
      }
    }
  }
}